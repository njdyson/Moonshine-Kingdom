<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moonshine Kingdom The Ledger v0.9 (Poker Chips)</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <!-- The board itself lives in the shared plate stylesheet; this file only
         carries the print-sheet chrome (A4 landscape, two boards per page). -->
    <link rel="stylesheet" href="css/ledger-board.css">
    <style>
        /* Page-chrome palette (the board defines its own, scoped internally). */
        :root {
            --bg: #100c08;
            --muted: #b8a577;
            --font-body: 'Barlow', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--muted);
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
        }

        /* --- A4 LANDSCAPE, TWO BOARDS PER SHEET --- */
        .page-container {
            width: 297mm;
            height: 210mm;
            background-color: var(--bg);
            padding: 6mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8mm;
        }

        /* --- PRINT SETTINGS --- */
        @page {
            size: A4 landscape;
            margin: 0;
        }
        @media print {
            body {
                background-color: var(--bg);
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">

        <!-- BOARD 1 -->
        <div class="dashboard-strip">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>

            <div class="main-title">The Ledger</div>
            <div class="top-instruction">Your Back-Room Desk</div>

            <div class="socket-row">

                <!-- Reserves -->
                <div class="cluster">
                    <div class="label">Reserves</div>
                    <div class="socket stash-socket"></div>
                </div>

                <div class="arrow-divider">&#10148;</div>

                <!-- Ledger -->
                <div class="cluster">
                    <div class="label">Ledger (Max 5)</div>
                    <div class="socket-group">
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                    </div>
                </div>

            </div>

            <div class="bottom-instruction">
                <span><b>Shadows:</b> Reserves &rarr; Ledger</span>
                <span>&bull;</span>
                <span><b>The Hustle:</b> Ledger &rarr; Reserves / Heat</span>
            </div>
        </div>

        <!-- BOARD 2 -->
        <div class="dashboard-strip">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>

            <div class="main-title">The Ledger</div>
            <div class="top-instruction">Your Back-Room Desk</div>

            <div class="socket-row">

                <!-- Reserves -->
                <div class="cluster">
                    <div class="label">Reserves</div>
                    <div class="socket stash-socket"></div>
                </div>

                <div class="arrow-divider">&#10148;</div>

                <!-- Ledger -->
                <div class="cluster">
                    <div class="label">Ledger (Max 5)</div>
                    <div class="socket-group">
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                        <div class="socket action-socket"></div>
                    </div>
                </div>

            </div>

            <div class="bottom-instruction">
                <span><b>Shadows:</b> Reserves &rarr; Ledger</span>
                <span>&bull;</span>
                <span><b>The Hustle:</b> Ledger &rarr; Reserves / Heat</span>
            </div>
        </div>

    </div>

</body>
</html>
