<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Titles v0.65</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css">
  <style>
    .title-card .card-header {
      min-height: 14mm;
      margin-bottom: 5px;
      padding: 2px 2px 1px;
    }

    .title-card .mission-name {
      margin: 2px;
      margin-top: 3px;
      font-size: 1.35em;
    }

    .title-card .borough-content {
      justify-content: flex-start;
    }

    /* Full-height art under the title bar (no footer text). */
    .title-card .borough-image {
      flex: 1 1 auto;
      width: auto;
      margin-bottom: 0;
    }

    .title-card .respect-badge[data-respect="2"] {
      background-image: url('Art/shield2-unified.png');
    }

  </style>
</head>

<body>
  <!-- Sheet 1: Borough Deeds -->
  <div class="page">
    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Manhattan</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Boroughs/Manhattan.png');"></div>
      </div>
    </div>

    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">The Bronx</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Boroughs/Bronx.png');"></div>
      </div>
    </div>

    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Queens</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Boroughs/Queens.png');"></div>
      </div>
    </div>

    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Brooklyn</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Boroughs/Brooklyn.png');"></div>
      </div>
    </div>
  </div>

  <div class="page-break"></div>

  <div class="page">
    <div class="card-back borough-back"><div class="back-title-box"><h3 class="back-title">BOROUGH DEED</h3></div></div>
    <div class="card-back borough-back"><div class="back-title-box"><h3 class="back-title">BOROUGH DEED</h3></div></div>
    <div class="card-back borough-back"><div class="back-title-box"><h3 class="back-title">BOROUGH DEED</h3></div></div>
    <div class="card-back borough-back"><div class="back-title-box"><h3 class="back-title">BOROUGH DEED</h3></div></div>
  </div>

  <div class="page-break"></div>

  <!-- Sheet 2 fronts: Staten deed + three Titles (2x2 grid = 4 cards) -->
  <div class="page">
    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Staten Island</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Boroughs/Staten.png');"></div>
      </div>
    </div>

    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Ward Boss</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Ward.png');"></div>
      </div>
    </div>

    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Harbormaster</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Bridge.png');"></div>
      </div>
    </div>

    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Night Mayor</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Mayor.png');"></div>
      </div>
    </div>
  </div>

  <div class="page-break"></div>

  <!-- Sheet 2 backs (duplex-aligned to the fronts above) -->
  <div class="page">
    <div class="card-back borough-back"><div class="back-title-box"><h3 class="back-title">BOROUGH DEED</h3></div></div>
    <div class="card-back ghetto-back"><div class="back-title-box"><h3 class="back-title">WARD BOSS</h3></div></div>
    <div class="card-back dock-back"><div class="back-title-box"><h3 class="back-title">HARBORMASTER</h3></div></div>
    <div class="card-back nightmayor-back"><div class="back-title-box"><h3 class="back-title">NIGHT MAYOR</h3></div></div>
  </div>

  <div class="page-break"></div>

  <!-- Sheet 3: Public Enemy (single card + its back) -->
  <div class="page">
    <div class="card title-card">
      <div class="card-header"><div class="header-top"><h2 class="mission-name">Public Enemy No.&nbsp;1</h2><span class="respect-badge" data-respect="2">2</span></div></div>
      <div class="borough-content">
        <div class="borough-image" style="background-image: url('Art/Chicago.png');"></div>
      </div>
    </div>
  </div>

  <div class="page-break"></div>

  <div class="page">
    <div class="card-back chicago"><div class="back-title-box"><h3 class="back-title">PUBLIC ENEMY No.&nbsp;1</h3></div></div>
  </div>
</body>

</html>
